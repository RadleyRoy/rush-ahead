name: Release

# Builds the Android app and publishes it as a GitHub Release: the APK (to install directly on a phone) and the App
# Bundle (for Google Play), versioned from the tag (v1.2.3 is version 1.2.3; the version code is the commit count).
#
# Runs only when a version tag is pushed (git tag v1.2.3 && git push origin v1.2.3), or by hand from the Actions tab
# with a version, in which case it tags the commit it built. Never on pull requests or branch pushes: the build uses
# the account's Unity licence and the upload key.
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (the upload .keystore, base64-encoded),
# ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME and ANDROID_KEYALIAS_PASS the builds are signed with the upload key and
# the bundle can go to Google Play. Without them they're signed with Unity's debug key and named NOT-FOR-PLAY: fine for
# installing on a phone, refused by Play.
#
# Known blocker (Nov 2026): GameCI's activation of a Unity Personal licence fails on Unity 6000.3 with "Code 400
# TimeStamp validation failed" (game-ci/unity-test-runner#336), so until that's fixed upstream the build jobs stop at
# activation. The steps before it (version, checkout, LFS, cache) can still be checked with a manual run.
#
# Security: this repo is public. Third-party actions are pinned to commit SHAs; inputs reach scripts only through
# environment variables; only the release job can write (to create the release and its tag).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 1.1.0 (the commit built is tagged v1.1.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version code counts every commit
          lfs: false

      - id: version
        name: Work out the version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then version="${GITHUB_REF_NAME#v}"; else version="${REQUESTED#v}"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::A version looks like 1.2.3; got '$version'"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already tagged; push that tag again or pick a new version"
            exit 1
          fi
          code=$(git rev-list --count HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Rush Ahead $version (version code $code)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the ${{ matrix.name }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: APK
            exportType: androidPackage
            symbols: none
            extension: apk
          - name: App Bundle
            exportType: androidAppBundle
            symbols: public # native symbols for Play's crash reports
            extension: aab
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      # The Unity Android editor image is large; reclaim space on the runner first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v7
        with:
          lfs: false # LFS objects come through the cache below

      - name: Restore Git LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - run: git lfs pull

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - id: signing
        name: Check for the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this build is signed with Unity's debug key, and Google Play won't take it."
          fi

      - uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        with:
          targetPlatform: Android
          buildName: RushAhead
          versioning: Custom
          version: ${{ needs.version.outputs.version }}
          androidVersionCode: ${{ needs.version.outputs.code }}
          androidExportType: ${{ matrix.exportType }}
          androidSymbolType: ${{ matrix.symbols }}
          # Named only when there's a key to sign with: a name without the file fails the build.
          androidKeystoreName: ${{ steps.signing.outputs.signed == 'true' && 'upload.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Name the file
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          built=$(find build/Android -maxdepth 1 -name "*.$EXTENSION" | head -n 1)
          if [ -z "$built" ]; then echo "::error::No .$EXTENSION in build/Android"; ls -la build/Android; exit 1; fi
          suffix=""
          if [ "$SIGNED" != "true" ]; then suffix="-NOT-FOR-PLAY"; fi
          mkdir -p release
          cp "$built" "release/RushAhead-$VERSION$suffix.$EXTENSION"
          ls -la release

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.extension }}
          path: release/
          retention-days: 14

  release:
    name: Publish the release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release, and its tag on a manual run
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          CODE: ${{ needs.version.outputs.code }}
        run: |
          cat > notes.md <<EOF
          Rush Ahead $VERSION (version code $CODE).

          - **RushAhead-$VERSION*.apk**: install it straight onto an Android phone (allow installs from this source when asked).
          - **RushAhead-$VERSION*.aab**: the App Bundle for Google Play. Files named NOT-FOR-PLAY are debug-signed: fine to install, refused by Play.
          EOF
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Rush Ahead $VERSION" \
            --notes-file notes.md \
            --generate-notes
